services:
  - type: web
    name: smart-class-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        fromSecret: mongodb_uri
      - key: SECRET_KEY
        fromSecret: secret_key
      - key: ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: 30
    autoDeploy: true
